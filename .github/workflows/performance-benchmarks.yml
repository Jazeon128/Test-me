name: Performance Benchmarks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Allow manual trigger

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for comparison
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run benchmarks
        working-directory: ./backend
        run: |
          pytest tests/benchmarks/ --benchmark-only --benchmark-json=benchmark-results.json --benchmark-verbose
      
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name != 'pull_request'
        with:
          name: Python Benchmark
          tool: 'pytest'
          output-file-path: backend/benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '110%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@maintainers'
      
      - name: Compare benchmarks (PR only)
        if: github.event_name == 'pull_request'
        working-directory: ./backend
        run: |
          # Checkout main branch to get baseline
          git fetch origin main:main
          git checkout main
          pytest tests/benchmarks/ --benchmark-only --benchmark-save=main --benchmark-autosave
          
          # Checkout PR branch and compare
          git checkout ${{ github.head_ref }}
          pytest tests/benchmarks/ --benchmark-only --benchmark-compare=main --benchmark-compare-fail=mean:10%
      
      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: backend/benchmark-results.json
          retention-days: 30
