version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: testme-db
    environment:
      POSTGRES_DB: testme
      POSTGRES_USER: testme_user
      POSTGRES_PASSWORD: testme_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testme_user -d testme"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testme-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testme-backend
    environment:
      # Database
      DATABASE_URL: postgresql://testme_user:testme_password@db:5432/testme
      
      # AI Configuration (set these in .env file)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      
      # Application
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      CORS_ORIGINS_STR: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # File Upload
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      UPLOAD_DIR: /app/uploads
      
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reloading
      - ./backend:/app
      # Persist uploads
      - backend_uploads:/app/uploads
      # Exclude Python cache
      - /app/__pycache__
      - /app/.pytest_cache
      - /app/.hypothesis
    depends_on:
      db:
        condition: service_healthy
    networks:
      - testme-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python -c 'import time; time.sleep(2)' &&
        echo 'Running database migrations...' &&
        alembic upgrade head &&
        echo 'Starting application...' &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testme-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot reloading
      - ./frontend:/app
      # Exclude node_modules
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - testme-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  testme-network:
    driver: bridge
