# Prometheus Alert Rules for Test Me Platform
# These rules define alerts for critical system conditions

groups:
  - name: api_alerts
    interval: 30s
    rules:
      # High error rate alert
      - alert: HighAPIErrorRate
        expr: |
          sum(rate(api_requests_total{status=~"5.."}[5m])) 
          / sum(rate(api_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High API error rate detected"
          description: "API error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          dashboard: "http://grafana:3000/d/testme-monitoring"
      
      # Slow API responses
      - alert: SlowAPIResponses
        expr: |
          histogram_quantile(0.95, 
            rate(api_request_duration_seconds_bucket[5m])
          ) > 2
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API responses are slow"
          description: "95th percentile response time is {{ $value | humanizeDuration }}"
          dashboard: "http://grafana:3000/d/testme-monitoring"
      
      # API endpoint down
      - alert: APIEndpointDown
        expr: up{job="testme-backend"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Test Me API is down"
          description: "The Test Me backend API has been down for more than 2 minutes"

  - name: question_generation_alerts
    interval: 30s
    rules:
      # High question generation failure rate
      - alert: HighQuestionGenerationFailureRate
        expr: |
          sum(rate(question_generation_total{status="failure"}[5m])) 
          / sum(rate(question_generation_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "High question generation failure rate"
          description: "Question generation failure rate is {{ $value | humanizePercentage }} (threshold: 10%)"
          dashboard: "http://grafana:3000/d/testme-monitoring"
      
      # Slow question generation
      - alert: SlowQuestionGeneration
        expr: |
          histogram_quantile(0.95, 
            rate(question_generation_duration_seconds_bucket[5m])
          ) > 60
        for: 10m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "Question generation is slow"
          description: "95th percentile generation time is {{ $value | humanizeDuration }} (threshold: 60s)"
          dashboard: "http://grafana:3000/d/testme-monitoring"

  - name: cost_alerts
    interval: 1h
    rules:
      # High AI costs
      - alert: HighAICosts
        expr: rate(ai_estimated_cost_usd[1h]) * 24 > 100
        for: 1h
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "AI costs are high"
          description: "Estimated daily AI cost is ${{ $value | humanize }} (threshold: $100/day)"
          dashboard: "http://grafana:3000/d/testme-monitoring"
      
      # Unusual spike in AI usage
      - alert: AIUsageSpike
        expr: |
          rate(ai_api_calls_total[5m]) > 
          avg_over_time(rate(ai_api_calls_total[5m])[1h:5m]) * 3
        for: 10m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "Unusual spike in AI API usage"
          description: "AI API call rate is 3x higher than the 1-hour average"

  - name: database_alerts
    interval: 30s
    rules:
      # Slow database queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95, 
            rate(db_query_duration_seconds_bucket[5m])
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database queries are slow"
          description: "95th percentile query time is {{ $value | humanizeDuration }} (threshold: 100ms)"
          dashboard: "http://grafana:3000/d/testme-monitoring"
      
      # High database error rate
      - alert: HighDatabaseErrorRate
        expr: |
          sum(rate(db_operations_total{status="failure"}[5m])) 
          / sum(rate(db_operations_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "High database error rate"
          description: "Database error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

  - name: performance_alerts
    interval: 30s
    rules:
      # Slow document parsing
      - alert: SlowDocumentParsing
        expr: |
          histogram_quantile(0.95, 
            rate(document_parsing_duration_seconds_bucket[5m])
          ) > 30
        for: 10m
        labels:
          severity: warning
          component: parser
        annotations:
          summary: "Document parsing is slow"
          description: "95th percentile parsing time is {{ $value | humanizeDuration }} (threshold: 30s)"
          dashboard: "http://grafana:3000/d/testme-monitoring"
